# Per-domain DKIM signing — keys exported by mail/provisioning to /var/lib/rspamd/dkim/
# Selector comes from mail_domains.dkim_selector (default pbx1).

enabled = true;
sign_local = true;
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector_map = "/etc/rspamd/local.d/dkim_selectors.map";

# Provisioning writes lines like:
#   prabhixtechnologies.com pbx1

use_domain = "header";
allow_username_mismatch = true;
allow_hdrfrom_mismatch = true;
