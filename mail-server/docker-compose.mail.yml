# Self-hosted mail transport — opt-in via --profile mailserver.
# Requires the base stack (postgres on network "prabhix") to be running first.
#
#   docker compose -f docker-compose.yml -f mail-server/docker-compose.mail.yml \
#     --profile mailserver up -d

name: prabhix-mail

networks:
  prabhix:
    external: true
    name: prabhix

volumes:
  maildata:
  mailstate:
  maillogs:
  rspamd_data:

services:
  postfix:
    profiles: [mailserver]
    image: boky/postfix:latest
    hostname: ${MAIL_HOSTNAME:-mail.prabhixtechnologies.com}
    restart: unless-stopped
    depends_on:
      - dovecot
      - rspamd
    environment:
      # boky/postfix entrypoint merges these into main.cf when set.
      ALLOWED_SENDER_DOMAINS: ${MAIL_ALLOWED_DOMAINS:-prabhixtechnologies.com}
      HOSTNAME: ${MAIL_HOSTNAME:-mail.prabhixtechnologies.com}
      MESSAGE_SIZE_LIMIT: "26214400"
      # Until AWS unblocks port 25, relay outbound through a smarthost (SES, Sendinblue, etc.).
      RELAYHOST: ${MAIL_RELAY_HOST:-}
      RELAYHOST_USERNAME: ${MAIL_RELAY_USER:-}
      RELAYHOST_PASSWORD: ${MAIL_RELAY_PASSWORD:-}
    volumes:
      - ./postfix/main.cf:/etc/postfix/main.cf:ro
      - ./postfix/master.cf:/etc/postfix/master.cf:ro
      - ./postfix/pgsql-virtual-mailbox-domains.cf:/etc/postfix/pgsql-virtual-mailbox-domains.cf:ro
      - ./postfix/pgsql-virtual-mailbox-maps.cf:/etc/postfix/pgsql-virtual-mailbox-maps.cf:ro
      - ./postfix/pgsql-virtual-alias-maps.cf:/etc/postfix/pgsql-virtual-alias-maps.cf:ro
      - maillogs:/var/log
    ports:
      - "25:25"
      - "587:587"
    networks:
      - prabhix

  dovecot:
    profiles: [mailserver]
    image: dovecot/dovecot:2.3.21-alpine
    hostname: ${MAIL_HOSTNAME:-mail.prabhixtechnologies.com}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-prabhix}
      POSTGRES_USER: ${POSTGRES_USER:-prabhix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prabhix}
    volumes:
      - ./dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./dovecot/conf.d:/etc/dovecot/conf.d:ro
      - ./dovecot/dovecot-sql.conf.ext:/etc/dovecot/dovecot-sql.conf.ext:ro
      - ./dovecot/bootstrap.passwd:/etc/dovecot/bootstrap.passwd:ro
      - maildata:/var/mail
      - mailstate:/var/lib/dovecot
    ports:
      - "993:993"
    networks:
      - prabhix

  rspamd:
    profiles: [mailserver]
    image: rspamd/rspamd:3.8
    hostname: rspamd
    restart: unless-stopped
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd_data:/var/lib/rspamd
    networks:
      - prabhix
