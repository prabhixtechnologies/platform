# Authentication — SQL first, with the passwd-file kept only as break-glass.
#
# This used to be the passwd-file alone, because mail_mailboxes had nowhere to keep a hash Dovecot
# could read. Migration V61 added password_hash and MailboxPasswordService writes it, so adding a
# mailbox is an API call instead of an edit to a file in the repository followed by a restart.

disable_plaintext_auth = yes
auth_mechanisms = plain login

# Order matters. SQL is authoritative: a mailbox whose password was revoked has a null
# password_hash, the query returns no row, and Dovecot moves on to the next passdb — so a stale
# bootstrap entry for the same address would silently keep working. Hence the file below holds only
# addresses that are not real mailboxes.
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# Break-glass only, for reaching the server when Postgres is unreachable. It ships empty; every
# entry is a password that cannot be revoked through the console, so add one for an incident and
# remove it afterwards. `doveadm pw -s BLF-CRYPT` generates the hash.
passdb {
  driver = passwd-file
  args = scheme=BLF-CRYPT username_format=%u /etc/dovecot/bootstrap.passwd
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

service auth {
  # Postfix connects here for SASL on submission (587).
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
