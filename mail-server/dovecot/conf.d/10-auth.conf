# Authentication — passwd-file bootstrap until platform syncs bcrypt hashes to Postgres.
#
# IMPORTANT: mail_mailboxes.imap_password_enc is AES-GCM encrypted by the application.
# Dovecot cannot decrypt it. Production IMAP auth requires either:
#   1. A provisioning job that writes {BLF-CRYPT} bcrypt hashes to mail_mailboxes.password_hash
#      (column to be added by mail/provisioning), then switch auth to sql/passdb.
#   2. The passwd-file below for initial bootstrap / break-glass accounts only.
#
# Generate a bootstrap entry: doveadm pw -s BLF-CRYPT

disable_plaintext_auth = yes
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=BLF-CRYPT username_format=%u /etc/dovecot/bootstrap.passwd
  # When password_hash is populated by provisioning, enable SQL instead:
  # driver = sql
  # args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

service auth {
  # Postfix connects here for SASL on submission (587).
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
