# Master service — LMTP for Postfix delivery + IMAPS for agent clients.

service lmtp {
  inet_listener lmtp {
    address = 0.0.0.0
    port = 24
  }
  # Unix socket Postfix virtual_transport uses.
  unix_listener dovecot-lmtp {
    mode = 0600
  }
}

service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service auth {
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

service stats {
  process_min_avail = 1
}
