# Mail storage — Maildir under /var/mail/vhosts/<domain>/<localpart>/
# Matches Postfix virtual_mailbox_maps path layout.

mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1000
last_valid_uid = 1000

namespace inbox {
  inbox = yes
  location =
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
}
