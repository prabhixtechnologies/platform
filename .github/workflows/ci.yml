name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# web-kit used to be pinned here as WEBKIT_REF, a commit SHA that the gate job cloned and the
# image build vendored as a `webkit` build context, because package.json file:-depended on it.
# That pin existed to stop the gates and the image being built against two different web-kits,
# which had already happened once.
#
# package-lock.json is that pin now. @prabhixtechnologies/brand is an ordinary versioned
# dependency resolved from GitHub Packages, so the lockfile fixes one exact tarball for the gate
# job, the test run and the image alike, and there is no second place for it to drift from.
#
# Upgrading is still deliberate: bump the range in package.json and commit the lockfile.

jobs:
  marketing:
    name: Marketing (Next.js)
    runs-on: ubuntu-latest
    # Reading @prabhixtechnologies/* from GitHub Packages. The packages are public, so the
    # built-in token is enough and no PAT has to be stored in this repository.
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing/package-lock.json
          # Writes a runner-local .npmrc carrying NODE_AUTH_TOKEN. The committed
          # marketing/.npmrc maps the scope; this supplies the credential.
          registry-url: https://npm.pkg.github.com
          scope: "@prabhixtechnologies"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npx tsc --noEmit

      # This is the only ESLint in the portfolio and it had never run: the repository carried
      # ESLint 9 with a legacy .eslintrc.json, which ESLint 9 does not read, and this job ran
      # typecheck, test and build but never lint. The config is now flat, the accessibility rules
      # are errors rather than Next's default warnings, and the six pre-existing
      # react-hooks/set-state-in-effect findings are listed by file in eslint.config.mjs.
      - name: Lint
        run: npm run lint

      # Colours come from the generated tokens or they do not ship. The checker ships inside
      # @prabhixtechnologies/brand as a bin, so it arrives with the dependency and runs against
      # the same version the build uses. It used to be invoked out of a cloned web-kit.
      #
      # Marketing has the most legitimate exceptions of any app, and all of them are recorded in
      # the source with a `px-allow-literal:` comment: the theme-color meta tags, the icon and
      # Open Graph routes that Next renders to an image on the server with no stylesheet, and the
      # Razorpay checkout, which runs in its own iframe and takes a hex string.
      - name: No hard-coded colours
        run: npx prabhix-check-colours src

      - name: No double-encoded text
        run: npx prabhix-check-mojibake src

      # The peer-dependency gate that used to run here is gone with the `file:` link it existed
      # for. npm does not install a linked package's own dependencies into the consumer, so every
      # app had to redeclare @prabhixtechnologies/ui's peers by hand. A registry install resolves
      # them normally, so there is nothing left to drift.

      # Sixteen of thirty pages rendered no h1, so their document started at level two and a
      # screen reader's heading list opened with no title. Section defaults titleAs to h2, so
      # this is the default rather than a mistake anybody made, and a check is the only thing
      # that keeps it fixed.
      - name: Every page has one top-level heading
        working-directory: marketing
        run: node scripts/check-headings.mjs
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build


  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [marketing]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      # The image build installs @prabhixtechnologies/brand from GitHub Packages.
      packages: read
      # Lets the job mint a short-lived OIDC token for AWS to exchange for temporary credentials.
      # Without it the role assumption below fails with a token error rather than an access error,
      # which is a confusing way to find out.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Prints the claims AWS compares the trust policy against, and nothing else.
      #
      # Kept after the migration rather than deleted with the rest of the scaffolding, because it is
      # the only way to see why an assumption was refused. Six runs failed with "Not authorized to
      # perform sts:AssumeRoleWithWebIdentity" while every observable input was correct, and two
      # unrelated causes were hiding behind that one message: this account issues immutable subject
      # claims of the form repo:owner@320051589/name@1349569564:ref:..., which no documented pattern
      # matches, and a repository_owner equality check that never matched a value the logs mask.
      # STS never names the claim it rejected and cloudtrail:LookupEvents is not granted to the
      # deployer, so without this step the next failure is guesswork again. See
      # Infra/deploy/aws/README-iam.md.
      #
      # Only the decoded payload is echoed. The token itself is a bearer credential and is never
      # printed; the claims are identifiers, and the job is already restricted to pushes on main.
      - name: Show the OIDC claims AWS will see
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            for (const key of ['iss', 'aud', 'sub', 'repository', 'repository_owner', 'ref', 'event_name', 'workflow_ref']) {
              core.info(`${key} = ${JSON.stringify(payload[key])}`);
            }

      # Amazon ECR is the only registry. The Docker Hub branch that used to sit here is gone, along
      # with the AWS_CI_ROLE_ARN variable that chose between them — with one registry that variable
      # stopped being a cutover switch and became a way for a repository to be silently
      # misconfigured, since an unset variable meant "push somewhere else" rather than "fail".
      #
      # The role ARN is written here rather than read from a variable for the same reason. The
      # account ID is already committed in Infra/deploy/aws/*.json and is not a secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::029096972251:role/prabhix-github-ecr-push
          # ap-south-1 because the EC2 instance is there. Pulling across regions is charged as
          # inter-region transfer on every deploy, for no benefit.
          aws-region: ap-south-1

      # No long-lived key anywhere: the role is assumed through GitHub's OIDC provider, and the
      # docker credentials this produces expire in twelve hours.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # The login action reports the registry host for the account the role belongs to, so the
          # account ID is not written down a second time and cannot drift from the role above.
          #
          # Repositories are namespaced — prabhix/backend — and the slash is required rather than
          # tidy: the deployer policy scopes ECR to repository/prabhix/*, and that pattern only
          # matches a name containing a slash. Creating prabhix-backend came back AccessDenied
          # against the real account while prabhix/probe succeeded.
          echo "base=${{ steps.ecr.outputs.registry }}/prabhix" >> "$GITHUB_OUTPUT"

      - name: Build and push marketing
        uses: docker/build-push-action@v7
        with:
          context: ./marketing
          file: ./marketing/Dockerfile
          # GitHub Packages wants a token even for a public package. A BuildKit secret rather
          # than a build-arg: a build-arg is recorded in the image history and this image is
          # pushed to ECR. The Dockerfile writes and deletes the credential inside one RUN.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          push: true
          # NEXT_PUBLIC_* is inlined at build time, so this is the only place the production
          # values can be set. ORG_SLUG and ORG_ID identify Prabhix's own tenant and are what
          # turn the storefront, chat widget and visitor beacon on.
          #
          # Written as literals rather than read from repository variables, which is how they were
          # set before. Two things went wrong with variables and both are silent. The variables were
          # not set at all, and an unset one expands to an empty string, so the site shipped with no
          # storefront, chat or beacon and the build passed. Then a build from before they were lost
          # baked in a slug and id from a database that has since been rebuilt, so the live site
          # addressed an organization that no longer exists and every public call 404'd.
          #
          # These are not environment-specific and not secret: oneOps/deploy/seed.sql defines this exact id
          # and slug, so a literal here cannot drift from the row it points at the way a variable
          # nobody can see did.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.prabhixtechnologies.com
            NEXT_PUBLIC_SITE_URL=https://prabhixtechnologies.com
            NEXT_PUBLIC_CONSOLE_URL=https://oneops.prabhixtechnologies.com
            NEXT_PUBLIC_MOBISTACK_URL=https://mobistack.prabhixtechnologies.com
            NEXT_PUBLIC_ORG_SLUG=prabhix-platform
            NEXT_PUBLIC_ORG_ID=00000000-0000-4000-8000-000000000001
          tags: |
            ${{ steps.meta.outputs.base }}/marketing:latest
            ${{ steps.meta.outputs.base }}/marketing:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
